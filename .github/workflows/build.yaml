name: pixeltune workflow

on: 
  - push

jobs:
  unittesting:
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: [18]

    runs-on: ${{matrix.os}}

    steps:
      - name: checkout
        uses: actions/checkout@v3

      - name: node setup
        uses: actions/setup-node@v4
        with:
          node-version: ${{matrix.node-version}}

      - name: Cache NPM dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: install dependences
        run: npm install

      - name: build application
        run: npm run build

      - name: upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-build-${{matrix.node-version}}
          path: dist

      - name: test the application
        run: npm test
        continue-on-error: true


  unittesting-with_container:
      runs-on: ubuntu-latest

      needs: unittesting

      container:
        image: node:20

      services:
        mongodb-service:
          image: mongo:7
          ports:
            - 27017:27017

      env:
        MONGODB_HOST: mongodb-service
        MONGODB_PORT: 27017

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Show Node version from job container
          run: node -v

        - name: Install Mongo client tools
          run: |
            apt-get update
            apt-get install -y dnsutils netcat-openbsd

        - name: Verify DNS resolution
          run: |
            getent hosts $MONGODB_HOST

        - name: Verify port connectivity
          run: |
            nc -zv $MONGODB_HOST $MONGODB_PORT

        - name: Install dependencies
          run: npm ci

        - name: Build app
          run: npm run build


  Docker:
    runs-on: ubuntu-latest
    needs: unittesting
    concurrency:
      group: prod 
      cancel-in-progress: true

    steps:

      - name: checkout
        uses: actions/checkout@v3

      - name: docker loging
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for testing
        uses: docker/build-push-action@v6
        with:
            context: .
            push: false
            load: true
            tags: pixeltune:test

      - name: Run Docker container
        run: |
            docker run -d --name pixeltune-app -p 8080:80 pixeltune:test

      - name: Wait for container startup
        run: sleep 5

      - name: Test application
        run: |
            curl -f http://127.0.0.1:8080

      - name: Tag Docker Image
        run: |
              docker tag pixeltune:test ${{ vars.DOCKER_USERNAME }}/pixeltune:latest
              docker tag pixeltune:test ${{ vars.DOCKER_USERNAME }}/pixeltune:${{ github.sha }}

      - name: Push Docker Image
        run: |
          docker push ${{ vars.DOCKER_USERNAME }}/pixeltune:latest
          docker push ${{ vars.DOCKER_USERNAME }}/pixeltune:${{ github.sha }}


